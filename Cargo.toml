[package]
name = "term_display_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "ca14783689eb0364ff987c0eb171e8e9dd0e7bd3" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.27"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.11", features = ["json"] }
regex = "1.0"
tempfile = "3.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
prost = "0.14"
futures-util = "0.3"
uuid = { version = "1.0", features = ["v7"] }
open = "5.0"
sha2 = "0.10"
base64 = "0.21"
rodio = { version = "0.19", features = ["mp3", "wav"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }